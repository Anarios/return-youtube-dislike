name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - Website/**
      - .github/workflows/website-deploy.yml
      - .nvmrc
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'Anarios/return-youtube-dislike'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: website-production
      url: https://returnyoutubedislike.com
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs

    steps:
      - name: Update trusted certificate authorities
        run: |
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install --yes --no-install-recommends --only-upgrade ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge 20260816ubuntu0.24.04.1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Use pinned npm
        run: npm install --global npm@10.8.2

      - name: Install dependencies
        run: npm ci
        working-directory: Website

      - name: Generate static website
        run: npm run generate
        working-directory: Website

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Upload hashed assets
        env:
          STORAGE_ACCOUNT: ${{ secrets.WEBSITE_STORAGE_ACCOUNT }}
        run: >
          az storage blob upload-batch --auth-mode login --account-name "$STORAGE_ACCOUNT"
          --destination '$web' --source Website/dist --pattern '_nuxt/*'
          --overwrite --only-show-errors --output none

      - name: Upload website files
        env:
          STORAGE_ACCOUNT: ${{ secrets.WEBSITE_STORAGE_ACCOUNT }}
        run: >
          az storage blob upload-batch --auth-mode login --account-name "$STORAGE_ACCOUNT"
          --destination '$web' --source Website/dist
          --overwrite --only-show-errors --output none

      - name: Purge CDN cache
        env:
          CDN_ENDPOINT_ID: ${{ secrets.WEBSITE_CDN_ENDPOINT_ID }}
        run: >
          az rest --method post
          --url "https://management.azure.com${CDN_ENDPOINT_ID}/purge?api-version=2024-02-01"
          --body '{"contentPaths":["/*"]}'
          --only-show-errors --output none
