# This workflow lints the code in /Website, if any was committed

name: Website Lint

on:
  push:
    branches:
      - main
    paths:
      - Website/**
      - .github/workflows/weblint.yml
      - .nvmrc
      - scripts/check-locales*
  pull_request:
    branches:
      - main
    paths:
      - Website/**
      - .github/workflows/weblint.yml
      - .nvmrc
      - scripts/check-locales*

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  weblint:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs

    steps:
      - name: Update trusted certificate authorities
        run: |
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install --yes --no-install-recommends --only-upgrade ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge 20260816ubuntu0.24.04.1

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Website

      - name: Run lint
        run: npm run lint
        working-directory: Website

      - name: Check website locales
        run: node scripts/check-locales.js --website
