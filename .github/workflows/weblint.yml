# This workflow lints the code in /Website, if any was committed

name: Website Lint

on:
  push:
    branches:
      - main
    paths:
      - Website/**
      - .github/workflows/weblint.yml
      - .nvmrc
      - scripts/check-locales*
  pull_request:
    branches:
      - main
    paths:
      - Website/**
      - .github/workflows/weblint.yml
      - .nvmrc
      - scripts/check-locales*

jobs:
  weblint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Website

      - name: Run lint
        run: npm run lint
        working-directory: Website

      - name: Check website locales
        run: node scripts/check-locales.js --website
